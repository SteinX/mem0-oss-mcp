name: Publish MCP release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to attach portable packages to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: client-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.28.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.14"
      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
      - name: Build all client archives
        run: |
          bash plugins/mem0-oss/scripts/build_pi_release.sh "${RELEASE_TAG#v}" "$RUNNER_TEMP/client-assets"
          python3 plugins/mem0-oss/scripts/build_client_releases.py "${RELEASE_TAG#v}" "$RUNNER_TEMP/client-assets"
      - name: Install extracted packages in all native clients
        run: |
          bash tests/run_pi_release_qa.sh "$RUNNER_TEMP/client-assets" "${RELEASE_TAG#v}"
          bash tests/run_client_release_qa.sh "$RUNNER_TEMP/client-assets" "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-client-assets
          path: ${{ runner.temp }}/client-assets/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-client-assets
          path: ${{ runner.temp }}/client-assets
      - name: Upload tested release attachments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/client-assets/"* \
            --repo "$GITHUB_REPOSITORY" --clobber

  image:
    needs: publish
    if: github.event_name == 'release' && !github.event.release.prerelease
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-ghcr.yml
