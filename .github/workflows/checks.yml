name: MCP and plugin checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install native Codex for configuration preservation checks
        run: npm install --global @openai/codex@0.160.1
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8,<9'
      - name: Check bridge and plugin adapters
        run: python -m pytest -q

  pi-runtime:
    runs-on: ubuntu-latest
    env:
      PI_QA_SIDECAR_SOURCE: ${{ github.workspace }}/sidecar-source
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: SteinX/mem0-platform-sidecar
          ref: 1084cb8dc788e9c8b5f1c6bfe818a699519ea4ae
          path: sidecar-source
      - name: Install the reviewed Sidecar runtime for real HTTP chain checks
        run: python -m pip install ./sidecar-source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.28.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.14"
      - name: Build and exercise Pi and Senpi MCP extensions
        run: tests/run_pi_qa.sh
      - name: Build and install release archives in Pi and Senpi
        run: |
          version=$(PYTHONPATH=src python -c 'from mem0_oss_mcp import __version__; print(__version__)')
          bash plugins/mem0-oss/scripts/build_pi_release.sh "$version" "$RUNNER_TEMP/pi-assets"
          bash tests/run_pi_release_qa.sh "$RUNNER_TEMP/pi-assets" "$version"

  client-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.14"
      - name: Build and exercise native Codex and OpenCode release packages
        run: |
          version=$(PYTHONPATH=src python -c 'from mem0_oss_mcp import __version__; print(__version__)')
          python3 plugins/mem0-oss/scripts/build_client_releases.py "$version" "$RUNNER_TEMP/client-assets"
          bash tests/run_client_release_qa.sh "$RUNNER_TEMP/client-assets" "$version"
