name: Publish GHCR image

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: Also update latest when manually publishing a tag (main already updates latest).
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
  PUSH_LATEST: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && inputs.push_latest))) }}

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: mcp-image-publication
      cancel-in-progress: false
      queue: max

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG || github.sha }}
          persist-credentials: false

      - name: Verify publication source
        id: source
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          if [ -n "$RELEASE_TAG" ]; then
            test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$source_sha"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve latest promotion
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest="$PUSH_LATEST"
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$latest" = "true" ]; then
            current_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [ "$current_tag" != "$RELEASE_TAG" ]; then
              latest=false
            fi
          fi
          echo "push_latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PUSH_LATEST: ${{ steps.latest.outputs.push_latest }}
        run: |
          image="$REGISTRY/${IMAGE_NAME,,}"
          sha_tag="$image:${SOURCE_SHA}"

          docker build -t "$sha_tag" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG:-${SOURCE_SHA}}" .
          docker push "$sha_tag"

          if [ -n "$RELEASE_TAG" ]; then
            docker tag "$sha_tag" "$image:$RELEASE_TAG"
            docker push "$image:$RELEASE_TAG"
          fi

          if [ "$PUSH_LATEST" = "true" ]; then
            docker tag "$sha_tag" "$image:latest"
            docker push "$image:latest"
          fi
