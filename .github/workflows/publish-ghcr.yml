name: Publish GHCR image

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - name: Verify publication source
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          if [ -n "$RELEASE_TAG" ]; then
            test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$source_sha"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          image="$REGISTRY/${IMAGE_NAME,,}"
          sha_tag="$image:${SOURCE_SHA}"

          docker build -t "$sha_tag" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${RELEASE_TAG:-${SOURCE_SHA}}" .
          docker push "$sha_tag"

          if [ -n "$RELEASE_TAG" ]; then
            docker tag "$sha_tag" "$image:$RELEASE_TAG"
            docker push "$image:$RELEASE_TAG"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$sha_tag" "$image:latest"
            docker push "$image:latest"
          fi
